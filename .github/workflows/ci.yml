name: Website checks

on:
  pull_request:
    branches: [main, develop/pdf-tools-repair]
  push:
    branches: [main, develop/pdf-tools-repair]

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SITE_URL: https://mypdffix.com
      VITE_NOINDEX: "false"
      CMS_AUTH_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: python -m pip install -r tests/new-tools/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npx playwright install --with-deps chromium
      - run: bun audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cms:unit && npm run test:new-tools:unit && npm run test:website:unit
      - run: npm run build
      - run: npm run test:pdf-tools
      - run: npm run test:new-tools
      - run: npm run test:cms
      - run: npm run test:website
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
